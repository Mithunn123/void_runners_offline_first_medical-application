[package]
name = "ehr-platform"
version = "0.1.0"
description = "The Forgotten Prescription - Medication Safety Platform"
authors = ["Sathyan"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "ehr_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
